name: hermes-weekly

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  hermes-weekly:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: List repo files
        run: dir

      - name: Verify maintenance script
        run: dir .\hermes-tracking\maintenance-audit.sh

      - name: Run maintenance audit
        run: bash .\hermes-tracking\maintenance-audit.sh
        shell: bash
        env:
          REPO: ${{ github.workspace }}

      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: hermes-weekly-audit-${{ github.run_id }}
          path: .\hermes-tracking\maintenance-audit.sh
          retention-days: 30
          compression-level: 1
